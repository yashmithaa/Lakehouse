# Services: Kafka (KRaft), Spark (master + worker), MinIO (S3-compatible store), Hive Metastore (PostgreSQL), Trino (SQL analytics)
# start: docker compose up -d --build
# stop: docker compose down -v

services:
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: lakehouse-kafka
    ports:
      - "9092:9092"     # external clients (producer, Spark)
      - "9093:9093"     # controller
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - lakehouse
  minio:
    image: minio/minio:latest
    container_name: lakehouse-minio
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # Web console
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lakehouse
  minio-init:
    image: minio/mc:latest
    container_name: lakehouse-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set myminio http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing myminio/lakehouse;
        mc mb --ignore-existing myminio/lakehouse-checkpoints;
        mc mb --ignore-existing myminio/lakehouse-warehouse;
        echo 'Buckets ready.';
      "
    networks:
      - lakehouse
  spark-master:
    build:
      context: ./docker/spark
      dockerfile: Dockerfile
    container_name: lakehouse-spark-master
    ports:
      - "8080:8080"     # Spark master web UI
      - "7077:7077"     # Spark master RPC
      - "4040:4040"     # Application UI (driver)
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    volumes:
      - ./spark-jobs:/opt/spark-jobs
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -lc '</dev/tcp/localhost/8080' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - lakehouse
  spark-worker:
    build:
      context: ./docker/spark
      dockerfile: Dockerfile
    container_name: lakehouse-spark-worker
    depends_on:
      spark-master:
        condition: service_healthy
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "--webui-port", "8081", "--cores", "2", "--memory", "2g", "spark://spark-master:7077"]
    ports:
      - "8081:8081"     # Worker web UI
    volumes:
      - ./spark-jobs:/opt/spark-jobs
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    networks:
      - lakehouse
  metastore-db:
    image: postgres:16-alpine
    container_name: lakehouse-metastore-db
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: metastore
    volumes:
      - metastore-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - lakehouse
  hive-metastore:
    build:
      context: ./docker/hive-metastore
      dockerfile: Dockerfile
    container_name: lakehouse-hive-metastore
    depends_on:
      metastore-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "9083:9083"     # Thrift metastore port
    environment:
      # JDBC connection to PostgreSQL
      METASTORE_DB_HOST: metastore-db
      METASTORE_DB_PORT: "5432"
      METASTORE_DB_NAME: metastore
      METASTORE_DB_USER: hive
      METASTORE_DB_PASS: hive
      # S3/MinIO settings
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_WAREHOUSE: s3a://lakehouse/warehouse/
    healthcheck:
      test: ["CMD-SHELL", "bash -lc '</dev/tcp/localhost/9083' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - lakehouse
  trino:
    image: trinodb/trino:439
    container_name: lakehouse-trino
    depends_on:
      hive-metastore:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8085:8080"     # Trino Web UI + JDBC
    volumes:
      - ./conf/trino/catalog:/etc/trino/catalog:ro
      - ./conf/trino/config.properties:/etc/trino/config.properties:ro
    healthcheck:
      test: ["CMD-SHELL", "trino --execute 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - lakehouse

volumes:
  kafka-data:
  minio-data:
  metastore-db-data:

networks:
  lakehouse:
    driver: bridge
